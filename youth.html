
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SOLYM | Light of Life Church</title>

  <!-- MONTSERRAT + FALLBACK DISPLAY FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Anton&display=swap"
    rel="stylesheet"
  >

  <style>

    /* ====================================
       YOUR LICENSED CANVA FONTS
    ==================================== */

    @font-face {
      font-family: "Paalabas Condensed";
      src: url("./fonts/PaalabasCondensed.woff2")
           format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Handelson Three";
      src: url("./fonts/HandelsonThree.woff2")
           format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* ====================================
       COLORS AND FONTS
    ==================================== */

    :root {
      --cream: #FFF9EF;
      --yellow: #EAD99A;
      --dark: #193E2C;

      --solym-font:
        "Paalabas Condensed",
        "Anton",
        Impact,
        sans-serif;

      --ministry-font:
        "Handelson Three",
        "Brush Script MT",
        cursive;
    }

    /* ====================================
       RESET
    ==================================== */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;

      background: var(--dark);
      color: var(--cream);

      font-family: "Montserrat", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 5px;
    }

    /* ====================================
       ANIMATED GREEN BACKGROUND
    ==================================== */

    .hero {
      position: relative;
      isolation: isolate;

      display: flex;
      flex-direction: column;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      overflow: hidden;

      background:
        radial-gradient(
          ellipse at 12% 18%,
          rgba(190, 240, 199, 0.35),
          transparent 38%
        ),

        radial-gradient(
          ellipse at 82% 72%,
          rgba(141, 205, 159, 0.35),
          transparent 45%
        ),

        linear-gradient(
          140deg,
          #71A67B 0%,
          #558D5E 22%,
          #244F38 46%,
          #447D54 67%,
          #173A2A 100%
        );

      background-size: 150% 150%;

      animation: greenMove 22s
                 ease-in-out infinite;
    }

    .hero::before {
      content: "";

      position: absolute;
      inset: 0;
      z-index: -1;

      pointer-events: none;

      background: linear-gradient(
        165deg,
        transparent 10%,
        rgba(225,255,224,.15) 25%,
        transparent 38%,
        rgba(12,48,31,.25) 52%,
        transparent 66%,
        rgba(192,238,206,.15) 78%,
        transparent 92%
      );

      filter: blur(40px);

      animation:
        greenWaves 16s ease-in-out
        infinite alternate;
    }

    /* ====================================
       CHURCH HEADER
       SAME STYLE AS WORSHIP MINISTRY
    ==================================== */

    .header {
      position: relative;
      z-index: 10;

      display: flex;
      align-items: center;

      width: 100%;
      padding: 38px 6%;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      display: block;

      width: 75px;
      height: 75px;

      object-fit: contain;
      border-radius: 6px;
    }

    .brand-name {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;

      font-family: "Montserrat", sans-serif;
      font-size: 25px;
      font-weight: 800;
      line-height: 1.2;
    }

    .brand-pill {
      display: inline-block;

      padding: 9px 15px;

      background: var(--cream);
      color: #386A43;

      border-radius: 50px;

      font-weight: 800;
    }

    /* ====================================
       CENTERED HERO
    ==================================== */

    .hero-center {
      position: relative;
      z-index: 2;

      flex: 1;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      width: 100%;

      padding: 55px 6% 80px;

      text-align: center;
    }

    .hero-label {
      margin: 0 0 35px;

      font-family: "Montserrat", sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 4px;

      color: var(--yellow);
    }

    /* ====================================
       SOLYM + YOUTH MINISTRY

       ACTUAL OVERLAP:
       SCRIPT IS POSITIONED INSIDE
       THE SOLYM LETTERING AREA
    ==================================== */

    .title-lockup {
      position: relative;

      width: fit-content;
      max-width: 100%;

      margin: 0 auto;

      padding: 0 8px 35px;
    }

    /* LARGE SOLYM LETTERS */

    .solym-title {
      position: relative;
      z-index: 1;

      margin: 0;

      color: var(--cream);

      font-family: var(--solym-font);
      font-size: clamp(100px, 20vw, 290px);
      font-weight: 400;
      font-style: normal;

      line-height: 1;
      letter-spacing: 0;

      white-space: nowrap;
      text-transform: uppercase;
    }

    /* ====================================
       SMALL SCRIPT OVER THE SOLYM LETTERS

       This is now ABSOLUTELY POSITIONED,
       not moved with a negative margin.
    ==================================== */

    .ministry-title {
      position: absolute;

      /* Position across SOLYM's lower area */
      top: 75%;
      left: 50%;

      z-index: 3;

      margin: 0;

      transform: translate(-50%, -50%);

      color: var(--yellow);

      font-family: var(--ministry-font);
      font-size: clamp(27px, 4.1vw, 60px);
      font-weight: 400;
      font-style: normal;

      line-height: 1.15;
      letter-spacing: 0;

      text-align: center;
      white-space: nowrap;

      text-shadow:
        2px 3px 5px rgba(25, 62, 44, .42);
    }

    /* ====================================
       DESCRIPTION
    ==================================== */

    .hero-description {
      max-width: 700px;

      margin: 40px auto 0;

      font-family: "Montserrat", sans-serif;
      font-size: clamp(15px, 1.5vw, 18px);
      font-weight: 500;
      line-height: 1.85;

      color: var(--cream);
    }

    /* ====================================
       BOTTOM LABEL
    ==================================== */

    .hero-bottom {
      position: relative;
      z-index: 2;

      padding: 24px 6% 38px;

      font-family: "Montserrat", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;

      text-align: center;
    }

    /* ====================================
       BACKGROUND ANIMATIONS
    ==================================== */

    @keyframes greenMove {
      0%, 100% {
        background-position: 0% 20%;
      }

      50% {
        background-position: 100% 80%;
      }
    }

    @keyframes greenWaves {
      from {
        transform:
          rotate(-7deg)
          translateX(-2%);
      }

      to {
        transform:
          rotate(-3deg)
          translateX(3%);
      }
    }

    /* ====================================
       TABLET
    ==================================== */

    @media (max-width: 900px) {
      .solym-title {
        font-size: clamp(90px, 19vw, 190px);
      }

      .ministry-title {
        font-size: clamp(26px, 4.4vw, 47px);
        top: 74%;
      }
    }

    /* ====================================
       MOBILE
    ==================================== */

    @media (max-width: 650px) {
      .header {
        padding: 27px 5%;
      }

      .brand-logo {
        width: 55px;
        height: 55px;
      }

      .brand-name {
        font-size: 18px;
        gap: 6px;
      }

      .brand-pill {
        padding: 6px 10px;
      }

      .hero-center {
        padding: 55px 4% 80px;
      }

      .hero-label {
        font-size: 10px;
        letter-spacing: 2px;
        margin-bottom: 30px;
      }

      .title-lockup {
        padding-bottom: 22px;
      }

      .solym-title {
        font-size: clamp(65px, 19vw, 125px);
      }

      .ministry-title {
        font-size: clamp(21px, 5.3vw, 35px);

        /* Slightly lower overlap on mobile */
        top: 77%;
      }

      .hero-description {
        margin-top: 30px;
        font-size: 14px;
        line-height: 1.85;
      }

      .hero-bottom {
        font-size: 9px;
        letter-spacing: 1px;
      }
    }

    /* ====================================
       REDUCED MOTION
    ==================================== */

    @media (prefers-reduced-motion: reduce) {
      .hero,
      .hero::before {
        animation: none !important;
      }
    }

  </style>
</head>

<body>

  <section class="hero">

    <!-- CHURCH BRAND -->

    <header class="header">

      <a
        href="./index.html"
        class="brand"
        aria-label="Return to Light of Life Church Homepage"
      >

        <img
          class="brand-logo"
          src="https://assets.cdn.filesafe.space/hDZZTUA89a5X4yE79AnS/media/6ae4a8b1736386d0dc75b141.jpg"
          alt="Light of Life Church Logo"
        >

        <span class="brand-name">

          <span>
            Light of
          </span>

          <span class="brand-pill">
            Life Church
          </span>

        </span>

      </a>

    </header>

    <!-- CENTERED MINISTRY TITLE -->

    <main class="hero-center">

      <p class="hero-label">
        LIGHT OF LIFE CHURCH
      </p>

      <div class="title-lockup">

        <h1 class="solym-title">
          SOLYM
        </h1>

        <h2 class="ministry-title">
          Youth Ministry
        </h2>

      </div>

      <p class="hero-description">
        A place for young people to grow in faith,
        build meaningful friendships,
        discover their God-given purpose,
        and shine the light of Christ
        in everyday life.
      </p>

    </main>

    <!-- BOTTOM LABEL -->

    <div class="hero-bottom">
      SHINE OUR LIGHT YOUTH MINISTRY
    </div>

  </section>

</body>
</html>
